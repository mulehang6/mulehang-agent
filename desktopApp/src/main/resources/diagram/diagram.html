<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图表预览</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", sans-serif;
      --diagram-surface: #FFFFFF;
      --diagram-text: #1F2329;
    }

    html,
    body,
    #diagram {
      box-sizing: border-box;
      height: 100%;
      margin: 0;
      width: 100%;
    }

    body {
      background: var(--diagram-surface);
      color: var(--diagram-text);
      overflow: hidden;
    }

    #diagram {
      align-items: center;
      background: var(--diagram-surface);
      display: flex;
      justify-content: center;
      min-height: 100%;
      overflow: hidden;
      padding: 12px;
      position: relative;
      touch-action: none;
      user-select: none;
    }

    #diagram > svg {
      display: block;
      height: 100%;
      max-height: none;
      max-width: none;
      transform-origin: center center;
      width: 100%;
      will-change: transform;
    }

    /*noinspection CssUnusedSymbol*/
    .error {
      color: #c75450;
      font-size: 14px;
      padding: 16px;
      white-space: pre-wrap;
    }
  </style>
  <!--suppress HtmlUnknownTarget -->
  <script src="mermaid/mermaid.min.js"></script>
</head>
<body>
  <main id="diagram" aria-live="polite"></main>
  <script>
    const READY_TITLE = "mulehang-diagram-ready";
    const ERROR_TITLE_PREFIX = "mulehang-diagram-error:";
    const WHEEL_INPUT_QUERY_FUNCTION = "mulehangDiagramWheelQuery";
    const SVG_QUERY_FUNCTION = "mulehangDiagramSvgQuery";
    const WHEEL_LINE_HEIGHT_PX = 16;
    const root = document.getElementById("diagram");
    const mermaid = window["mermaid"];
    const viewportState = {
      dragOriginX: 0,
      dragOriginY: 0,
      panX: 0,
      panY: 0,
      pointerId: null,
      svg: null,
      zoomPercent: 100,
      viewportFrame: null,
    };

    function diagramError(category, message) {
      const error = new Error(message);
      error.category = category;
      return error;
    }

    function decodeBase64Url(value) {
      const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
      const padded = normalized.padEnd(Math.ceil(normalized.length / 4) * 4, "=");
      const bytes = Uint8Array.from(atob(padded), character => character.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function parseSvgLength(value) {
      const parsed = Number.parseFloat(value || "");
      return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
    }

    function svgAspectRatio(svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width > 0 && viewBox.height > 0) {
        return viewBox.width / viewBox.height;
      }
      const width = parseSvgLength(svg.getAttribute("width"));
      const height = parseSvgLength(svg.getAttribute("height"));
      return width && height ? width / height : null;
    }

    function normalizeZoomPercent(value) {
      const rounded = Math.round(Number(value));
      if (!Number.isFinite(rounded)) return 100;
      return Math.min(500, Math.max(50, rounded));
    }

    function viewportPanBounds() {
      const rectangle = root.getBoundingClientRect();
      const scale = viewportState.zoomPercent / 100;
      return {
        horizontal: Math.max(0, (rectangle.width * scale - rectangle.width) / 2),
        vertical: Math.max(0, (rectangle.height * scale - rectangle.height) / 2),
      };
    }

    function clampPanOffset(value, bound) {
      return Math.min(bound, Math.max(-bound, value));
    }

    function applyViewportTransform() {
      const svg = viewportState.svg;
      if (!svg) return;
      const bounds = viewportPanBounds();
      if (viewportState.zoomPercent <= 100) {
        viewportState.panX = 0;
        viewportState.panY = 0;
      } else {
        viewportState.panX = clampPanOffset(viewportState.panX, bounds.horizontal);
        viewportState.panY = clampPanOffset(viewportState.panY, bounds.vertical);
      }
      svg.style.transform = `translate(${viewportState.panX}px, ${viewportState.panY}px) scale(${viewportState.zoomPercent / 100})`;
      root.classList.toggle("can-pan", viewportState.zoomPercent > 100);
    }

    function scheduleViewportTransform() {
      if (viewportState.viewportFrame !== null) return;
      viewportState.viewportFrame = requestAnimationFrame(() => {
        viewportState.viewportFrame = null;
        applyViewportTransform();
      });
    }

    function keepAnchorStableDuringZoom(nextZoomPercent, anchorX, anchorY) {
      const rectangle = root.getBoundingClientRect();
      if (
        !Number.isFinite(anchorX) ||
        !Number.isFinite(anchorY) ||
        rectangle.width <= 0 ||
        rectangle.height <= 0
      ) {
        return;
      }
      const clampedX = Math.min(rectangle.width, Math.max(0, anchorX));
      const clampedY = Math.min(rectangle.height, Math.max(0, anchorY));
      const currentScale = viewportState.zoomPercent / 100;
      const nextScale = nextZoomPercent / 100;
      const relativeX = clampedX - rectangle.width / 2 - viewportState.panX;
      const relativeY = clampedY - rectangle.height / 2 - viewportState.panY;
      viewportState.panX += relativeX * (1 - nextScale / currentScale);
      viewportState.panY += relativeY * (1 - nextScale / currentScale);
    }

    function setDiagramZoom(value, anchorX, anchorY) {
      const nextZoomPercent = normalizeZoomPercent(value);
      if (nextZoomPercent === viewportState.zoomPercent) return;
      keepAnchorStableDuringZoom(nextZoomPercent, anchorX, anchorY);
      viewportState.zoomPercent = nextZoomPercent;
      scheduleViewportTransform();
    }

    function wheelDeltaInPixels(event) {
      if (!Number.isFinite(event.deltaY)) return 0;
      if (event.deltaMode === 1) return event.deltaY * WHEEL_LINE_HEIGHT_PX;
      if (event.deltaMode === 2) return event.deltaY * root.clientHeight;
      return event.deltaY;
    }

    let pendingWheelInputs = [];
    let wheelInputFrame = null;

    function enqueueWheelInput(event) {
      const deltaY = wheelDeltaInPixels(event);
      if (deltaY === 0) return;
      const previousInput = pendingWheelInputs[pendingWheelInputs.length - 1];
      if (previousInput && previousInput.controlDown === event.ctrlKey) {
        previousInput.deltaY += deltaY;
        previousInput.x = event.clientX;
        previousInput.y = event.clientY;
      } else {
        pendingWheelInputs.push({
          controlDown: event.ctrlKey,
          deltaY,
          x: event.clientX,
          y: event.clientY,
        });
      }
      if (wheelInputFrame !== null) return;
      wheelInputFrame = window.requestAnimationFrame(forwardPendingWheelInputs);
    }

    function forwardPendingWheelInputs() {
      wheelInputFrame = null;
      const wheelInputs = pendingWheelInputs;
      pendingWheelInputs = [];
      const query = window[WHEEL_INPUT_QUERY_FUNCTION];
      if (typeof query !== "function") return;
      wheelInputs.forEach(input => {
        if (input.deltaY === 0) return;
        query({
          request: JSON.stringify({
            type: "wheel",
            controlDown: input.controlDown,
            deltaY: input.deltaY,
            x: input.x,
            y: input.y,
          }),
          onSuccess: () => {},
          onFailure: () => {},
        });
      });
    }

    function finishPointerDrag(event) {
      if (viewportState.pointerId !== event.pointerId) return;
      if (root.hasPointerCapture(event.pointerId)) {
        root.releasePointerCapture(event.pointerId);
      }
      viewportState.pointerId = null;
      root.classList.remove("dragging");
    }

    root.addEventListener("pointerdown", event => {
      if (event.button !== 0 || !viewportState.svg || viewportState.zoomPercent <= 100) return;
      viewportState.pointerId = event.pointerId;
      viewportState.dragOriginX = viewportState.panX - event.clientX;
      viewportState.dragOriginY = viewportState.panY - event.clientY;
      root.setPointerCapture(event.pointerId);
      root.classList.add("dragging");
      event.preventDefault();
    });

    root.addEventListener("pointermove", event => {
      if (viewportState.pointerId !== event.pointerId) return;
      const bounds = viewportPanBounds();
      viewportState.panX = clampPanOffset(viewportState.dragOriginX + event.clientX, bounds.horizontal);
      viewportState.panY = clampPanOffset(viewportState.dragOriginY + event.clientY, bounds.vertical);
      scheduleViewportTransform();
      event.preventDefault();
    });

    root.addEventListener("pointerup", finishPointerDrag);
    root.addEventListener("pointercancel", finishPointerDrag);
    root.addEventListener("wheel", event => {
      event.preventDefault();
      enqueueWheelInput(event);
    }, { passive: false });
    window.addEventListener("resize", scheduleViewportTransform);
    if (typeof ResizeObserver === "function") {
      new ResizeObserver(scheduleViewportTransform).observe(root);
    }

    function reportSvg(svg) {
      if (!svg) return;
      const query = window[SVG_QUERY_FUNCTION];
      if (typeof query !== "function") return;
      query({
        request: new XMLSerializer().serializeToString(svg),
        onSuccess: () => {},
        onFailure: () => {},
      });
    }

    window.mulehangDiagram = {
      requestSvg: () => reportSvg(viewportState.svg),
      setZoom: setDiagramZoom,
    };

    function prepareSvg(svg) {
      if (!svg.getAttribute("viewBox")) {
        const width = parseSvgLength(svg.getAttribute("width"));
        const height = parseSvgLength(svg.getAttribute("height"));
        if (width && height) {
          svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        }
      }
      svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
      svg.style.height = "100%";
      svg.style.maxHeight = "none";
      svg.style.maxWidth = "none";
      svg.style.width = "100%";
      viewportState.svg = svg;
      viewportState.panX = 0;
      viewportState.panY = 0;
      viewportState.zoomPercent = 100;
      applyViewportTransform();
      return svg;
    }

    function appendSvg(svg) {
      const documentNode = new DOMParser().parseFromString(svg, "image/svg+xml");
      if (documentNode.documentElement.localName === "parsererror") {
        throw new Error("图表 SVG 无法解析。");
      }
      documentNode.querySelectorAll("script, iframe, object, embed, link").forEach(node => node.remove());
      documentNode.querySelectorAll("*").forEach(node => {
        Array.from(node.attributes).forEach(attribute => {
          const attributeName = attribute.name.toLowerCase();
          if (attributeName.startsWith("on")) {
            node.removeAttribute(attribute.name);
          } else if (
            (attributeName === "href" || attributeName === "xlink:href") &&
            !attribute.value.trim().startsWith("#")
          ) {
            node.removeAttribute(attribute.name);
          }
        });
      });
      const renderedSvg = document.importNode(documentNode.documentElement, true);
      if (renderedSvg.localName !== "svg") {
        throw new Error("图表内容不是 SVG。");
      }
      root.replaceChildren(renderedSvg);
      return prepareSvg(renderedSvg);
    }

    function setPalette(isDark) {
      document.documentElement.style.setProperty("--diagram-surface", isDark ? "#191A1C" : "#FFFFFF");
      document.documentElement.style.setProperty("--diagram-text", isDark ? "#E7EAF0" : "#1F2329");
    }

    function hasMermaidSourceThemeConfiguration(source) {
      const directive = /%%\{\s*(?:init|config)\s*:[\s\S]*?["']?(?:theme|themeVariables)["']?\s*:/i;
      const frontMatter = /^\s*---\s*\r?\n[\s\S]*?^\s*(?:theme|themeVariables)\s*:/im;
      return directive.test(source) || frontMatter.test(source);
    }

    function automaticMermaidThemeVariables(isDark) {
      return isDark
        ? {
            actorBkg: "#31343C",
            actorBorder: "#AEB9CF",
            actorTextColor: "#F4F7FC",
            background: "#191A1C",
            clusterBkg: "#24272E",
            clusterBorder: "#8F9BB3",
            darkMode: true,
            edgeLabelBackground: "#2B2D30",
            lineColor: "#B6C2DA",
            primaryBorderColor: "#AEB9CF",
            primaryColor: "#31343C",
            primaryTextColor: "#F4F7FC",
            secondaryBorderColor: "#9BA9C2",
            secondaryColor: "#2B2D30",
            secondaryTextColor: "#F4F7FC",
            tertiaryBorderColor: "#8F9BB3",
            tertiaryColor: "#24272E",
            tertiaryTextColor: "#F4F7FC",
            textColor: "#E7EAF0",
            titleColor: "#F4F7FC",
          }
        : {
            actorBkg: "#FFFFFF",
            actorBorder: "#596273",
            actorTextColor: "#1F2329",
            background: "#FFFFFF",
            clusterBkg: "#F4F5F7",
            clusterBorder: "#6B7180",
            darkMode: false,
            edgeLabelBackground: "#FFFFFF",
            lineColor: "#4F5B70",
            primaryBorderColor: "#596273",
            primaryColor: "#FFFFFF",
            primaryTextColor: "#1F2329",
            secondaryBorderColor: "#6B7180",
            secondaryColor: "#F4F5F7",
            secondaryTextColor: "#1F2329",
            tertiaryBorderColor: "#7A8496",
            tertiaryColor: "#E9EAEE",
            tertiaryTextColor: "#1F2329",
            textColor: "#1F2329",
            titleColor: "#1F2329",
          };
    }

    async function renderMermaid(source, isDark, applyAutomaticTheme) {
      if (!mermaid) {
        throw diagramError("resource-missing", "本地 Mermaid 资源未加载。");
      }
      const configuration = {
        startOnLoad: false,
        securityLevel: "strict",
        htmlLabels: false,
        flowchart: { useMaxWidth: true },
        sequence: { useMaxWidth: true },
      };
      if (applyAutomaticTheme && !hasMermaidSourceThemeConfiguration(source)) {
        configuration.theme = "base";
        configuration.themeVariables = automaticMermaidThemeVariables(isDark);
      }
      mermaid.initialize(configuration);
      try {
        const rendered = await mermaid.render("mulehang-diagram", source);
        return appendSvg(rendered.svg);
      } catch (error) {
        throw diagramError(
          "mermaid-syntax",
          error instanceof Error ? error.message : "Mermaid 图表语法错误。",
        );
      }
    }

    function reportReady(svg) {
      const aspectRatio = svgAspectRatio(svg);
      document.title = Number.isFinite(aspectRatio)
        ? `${READY_TITLE}:${aspectRatio.toFixed(6)}`
        : READY_TITLE;
      reportSvg(svg);
    }

    async function renderDiagram() {
      const parameters = new URLSearchParams(location.search);
      const kind = parameters.get("kind");
      const isDark = parameters.get("theme") === "dark";
      const applyAutomaticTheme = parameters.get("themePolicy") === "auto";
      const source = decodeBase64Url(location.hash.slice(1));
      setPalette(isDark);
      let svg;
      if (kind === "plantuml") {
        svg = appendSvg(source);
      } else if (kind === "mermaid") {
        svg = await renderMermaid(source, isDark, applyAutomaticTheme);
      } else {
        throw new Error("不支持的图表类型。");
      }
      reportReady(svg);
    }

    renderDiagram().catch(error => {
      root.replaceChildren();
      const message = document.createElement("p");
      message.className = "error";
      message.textContent = error instanceof Error ? error.message : "图表渲染失败。";
      root.append(message);
      const category = typeof error?.category === "string"
        ? error.category
        : (new URLSearchParams(location.search).get("kind") === "mermaid" ? "mermaid-syntax" : "page-load");
      console.error(`${ERROR_TITLE_PREFIX}${category}`, message.textContent);
      document.title = `${ERROR_TITLE_PREFIX}${category}`;
    });
  </script>
</body>
</html>
