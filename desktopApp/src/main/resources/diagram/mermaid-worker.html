<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Mermaid 后台工作器</title>
  <!--suppress HtmlUnknownTarget -->
  <script src="mermaid/mermaid.min.js"></script>
</head>
<body>
  <main id="diagram" aria-hidden="true"></main>
  <script>
    const RENDER_QUERY_FUNCTION = "mulehangMermaidRenderQuery";
    const FIELD_SEPARATOR = "|";
    const STATUS_READY = "ready";
    const STATUS_SUCCESS = "success";
    const STATUS_FAILURE = "failure";
    const APPLICATION_FONT_FAMILY = "sans-serif";
    const root = document.getElementById("diagram");
    const mermaid = window["mermaid"];
    const workerGeneration = Number.parseInt(
      new URLSearchParams(location.search).get("generation") || "",
      10,
    );
    const PRESENTATION_PROPERTIES = [
      ["alignment-baseline", "alignment-baseline"],
      ["color", "color"],
      ["display", "display"],
      ["dominant-baseline", "dominant-baseline"],
      ["fill", "fill"],
      ["fill-opacity", "fill-opacity"],
      ["fill-rule", "fill-rule"],
      ["font-family", "font-family"],
      ["font-kerning", "font-kerning"],
      ["font-size", "font-size"],
      ["font-style", "font-style"],
      ["font-variant", "font-variant"],
      ["font-weight", "font-weight"],
      ["letter-spacing", "letter-spacing"],
      ["marker-end", "marker-end"],
      ["marker-mid", "marker-mid"],
      ["marker-start", "marker-start"],
      ["opacity", "opacity"],
      ["paint-order", "paint-order"],
      ["shape-rendering", "shape-rendering"],
      ["stop-color", "stop-color"],
      ["stop-opacity", "stop-opacity"],
      ["stroke", "stroke"],
      ["stroke-dasharray", "stroke-dasharray"],
      ["stroke-dashoffset", "stroke-dashoffset"],
      ["stroke-linecap", "stroke-linecap"],
      ["stroke-linejoin", "stroke-linejoin"],
      ["stroke-miterlimit", "stroke-miterlimit"],
      ["stroke-opacity", "stroke-opacity"],
      ["stroke-width", "stroke-width"],
      ["text-anchor", "text-anchor"],
      ["text-rendering", "text-rendering"],
      ["vector-effect", "vector-effect"],
      ["visibility", "visibility"],
      ["white-space", "white-space"],
      ["word-spacing", "word-spacing"],
    ];
    let renderQueue = Promise.resolve();

    function workerError(category, message) {
      const error = new Error(message);
      error.category = category;
      return error;
    }

    function decodeBase64Url(value) {
      const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
      const padded = normalized.padEnd(Math.ceil(normalized.length / 4) * 4, "=");
      const bytes = Uint8Array.from(atob(padded), character => character.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function encodeBase64Url(value) {
      const bytes = new TextEncoder().encode(value);
      let binary = "";
      bytes.forEach(byte => {
        binary += String.fromCharCode(byte);
      });
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function parseSvgLength(value) {
      const parsed = Number.parseFloat(value || "");
      return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
    }

    function ensureViewBox(svg) {
      if (!svg.getAttribute("viewBox")) {
        const width = parseSvgLength(svg.getAttribute("width"));
        const height = parseSvgLength(svg.getAttribute("height"));
        if (width && height) {
          svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        }
      }
      svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    }

    function isExternalPaint(value) {
      const normalized = value.trim().toLowerCase();
      return normalized.includes("url(") && !normalized.includes("url(#");
    }

    function removeDangerousNodes(svg) {
      if (Array.from(svg.querySelectorAll("*")).some(node => node.localName === "foreignObject")) {
        throw workerError("unsupported", "该 Mermaid 图表需要 HTML 标签，不能作为纯矢量图显示。");
      }
      svg.querySelectorAll("script, iframe, object, embed, link").forEach(node => node.remove());
      svg.querySelectorAll("*").forEach(node => {
        Array.from(node.attributes).forEach(attribute => {
          const name = attribute.name.toLowerCase();
          if (name.startsWith("on")) {
            node.removeAttribute(attribute.name);
          } else if (
            (name === "href" || name === "xlink:href") &&
            !attribute.value.trim().startsWith("#")
          ) {
            node.removeAttribute(attribute.name);
          }
        });
      });
    }

    function materializeComputedStyles(svg) {
      [svg, ...svg.querySelectorAll("*")].forEach(node => {
        const style = window.getComputedStyle(node);
        PRESENTATION_PROPERTIES.forEach(([property, attribute]) => {
          const value = style.getPropertyValue(property).trim();
          if (value && !isExternalPaint(value)) {
            node.setAttribute(attribute, value);
          }
        });
        node.removeAttribute("style");
      });
      svg.querySelectorAll("style").forEach(node => node.remove());
    }

    function appendSvg(svgMarkup) {
      const parsed = new DOMParser().parseFromString(svgMarkup, "image/svg+xml");
      if (parsed.documentElement.localName === "parsererror") {
        throw workerError("worker", "Mermaid 输出的 SVG 无法解析。");
      }
      const svg = document.importNode(parsed.documentElement, true);
      if (svg.localName !== "svg") {
        throw workerError("worker", "Mermaid 输出的内容不是 SVG。");
      }
      root.replaceChildren(svg);
      removeDangerousNodes(svg);
      ensureViewBox(svg);
      materializeComputedStyles(svg);
      return new XMLSerializer().serializeToString(svg);
    }

    function hasMermaidSourceThemeConfiguration(source) {
      return hasMermaidSourceConfiguration(source, "theme|themeVariables");
    }

    function hasMermaidSourceFontConfiguration(source) {
      return hasMermaidSourceConfiguration(source, "fontFamily");
    }

    function hasMermaidSourceConfiguration(source, propertyPattern) {
      const directive = new RegExp(
        `%%\\{\\s*(?:init|config)\\s*:[\\s\\S]*?["']?(?:${propertyPattern})["']?\\s*:`,
        "i",
      );
      const frontMatter = new RegExp(
        `^\\s*---\\s*\\r?\\n[\\s\\S]*?^\\s*(?:${propertyPattern})\\s*:`,
        "im",
      );
      return directive.test(source) || frontMatter.test(source);
    }

    function automaticMermaidThemeVariables(isDark) {
      return isDark
        ? {
            actorBkg: "#31343C",
            actorBorder: "#AEB9CF",
            actorTextColor: "#F4F7FC",
            background: "transparent",
            clusterBkg: "#24272E",
            clusterBorder: "#8F9BB3",
            darkMode: true,
            edgeLabelBackground: "#2B2D30",
            lineColor: "#B6C2DA",
            primaryBorderColor: "#AEB9CF",
            primaryColor: "#31343C",
            primaryTextColor: "#F4F7FC",
            secondaryBorderColor: "#9BA9C2",
            secondaryColor: "#2B2D30",
            secondaryTextColor: "#F4F7FC",
            tertiaryBorderColor: "#8F9BB3",
            tertiaryColor: "#24272E",
            tertiaryTextColor: "#F4F7FC",
            textColor: "#E7EAF0",
            titleColor: "#F4F7FC",
          }
        : {
            actorBkg: "#FFFFFF",
            actorBorder: "#596273",
            actorTextColor: "#1F2329",
            background: "transparent",
            clusterBkg: "#F4F5F7",
            clusterBorder: "#6B7180",
            darkMode: false,
            edgeLabelBackground: "#FFFFFF",
            lineColor: "#4F5B70",
            primaryBorderColor: "#596273",
            primaryColor: "#FFFFFF",
            primaryTextColor: "#1F2329",
            secondaryBorderColor: "#6B7180",
            secondaryColor: "#F4F5F7",
            secondaryTextColor: "#1F2329",
            tertiaryBorderColor: "#7A8496",
            tertiaryColor: "#E9EAEE",
            tertiaryTextColor: "#1F2329",
            textColor: "#1F2329",
            titleColor: "#1F2329",
          };
    }

    async function renderMermaid(request) {
      if (!mermaid) {
        throw workerError("resource", "本地 Mermaid 资源未加载。");
      }
      const source = decodeBase64Url(request.source);
      const configuration = {
        startOnLoad: false,
        securityLevel: "strict",
        htmlLabels: false,
        secure: ["securityLevel", "startOnLoad", "htmlLabels"],
        flowchart: { useMaxWidth: true },
        sequence: { useMaxWidth: true },
      };
      if (request.themePolicy === "auto") {
        const sourceSetsTheme = hasMermaidSourceThemeConfiguration(source);
        const sourceSetsFont = hasMermaidSourceFontConfiguration(source);
        if (!sourceSetsTheme) {
          configuration.theme = "base";
          const themeVariables = automaticMermaidThemeVariables(request.isDark);
          if (!sourceSetsFont) themeVariables.fontFamily = APPLICATION_FONT_FAMILY;
          configuration.themeVariables = themeVariables;
        }
        if (!sourceSetsFont) configuration.fontFamily = APPLICATION_FONT_FAMILY;
      }
      mermaid.initialize(configuration);
      try {
        const rendered = await mermaid.render(`mulehang-mermaid-${request.requestId}`, source);
        return appendSvg(rendered.svg);
      } catch (error) {
        throw workerError(
          "syntax",
          error instanceof Error ? error.message : "Mermaid 图表语法错误。",
        );
      }
    }

    function postWorkerMessage(fields) {
      const request = fields.join(FIELD_SEPARATOR);
      const send = () => {
        const query = window[RENDER_QUERY_FUNCTION];
        if (typeof query !== "function") {
          window.setTimeout(send, 25);
          return;
        }
        query({
          request,
          onSuccess: () => {},
          onFailure: () => {},
        });
      };
      send();
    }

    function postResult(requestId, status, category, payload) {
      const fields = status === STATUS_SUCCESS
        ? [workerGeneration, requestId, status, encodeBase64Url(payload)]
        : [workerGeneration, requestId, status, category, encodeBase64Url(payload)];
      postWorkerMessage(fields);
    }

    function enqueueRender(request) {
      renderQueue = renderQueue
        .catch(() => {})
        .then(() => renderMermaid(request))
        .then(svg => postResult(request.requestId, STATUS_SUCCESS, "", svg))
        .catch(error => {
          const category = typeof error?.category === "string" ? error.category : "worker";
          const message = error instanceof Error ? error.message : "Mermaid 工作器渲染失败。";
          postResult(request.requestId, STATUS_FAILURE, category, message);
        });
    }

    window.mulehangRender = request => {
      if (!Number.isSafeInteger(request?.requestId) || request.requestId <= 0 || typeof request.source !== "string") {
        return;
      }
      enqueueRender(request);
    };

    if (Number.isSafeInteger(workerGeneration) && workerGeneration > 0) {
      postWorkerMessage([STATUS_READY, workerGeneration]);
    }
  </script>
</body>
</html>
